# Windows + Docker Desktop (Linux containers).
# Run from the parent folder with .\start.ps1
services:
  redis:
    ports: !reset []

  chromadb:
    ports: !reset []

  nginx:
    ports: !override
      - "127.0.0.1:8088:80"

  mediflow:
    ports: !override
      - "127.0.0.1:8002:8000"
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      PROMETHEUS_PORT: "0"
      MEDIFLOW_SCENARIO: healthcare
      MEDIFLOW_SKILLS_DIR: /app/skills/healthcare
      MCP_EXTERNAL_ENABLED: "false"
      EVAL_BASELINE_PATH: /app/data/eval/healthcare-baseline.json

  frontend:
    build:
      context: ../MediFlowFrontend
      dockerfile: Dockerfile
    container_name: mediflow-web
    environment:
      PYTHON_API_URL: /api/python
      ENABLED_BACKENDS: python
    ports:
      - "127.0.0.1:5175:80"
    volumes:
      - ./config/nginx/frontend.windows.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      mediflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/runtime-config.js || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mediflow-network
