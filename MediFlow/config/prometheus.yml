# Prometheus 配置文件 — MediFlow 医疗健康咨询系统

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'mediflow'
    environment: 'production'

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # MediFlow 主应用指标
  - job_name: 'mediflow-app'
    static_configs:
      - targets: ['mediflow:8000']
        labels:
          service: 'mediflow'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
